name: Collect Sports Odds

on:
  # Enables the manual "Run workflow" button in the Actions tab
  workflow_dispatch:
  
  # Automated schedule based on UTC (EDT + 4 hours)
  schedule:
    - cron: '0 14 * * *'  # 10:00 AM EDT
    - cron: '0 17 * * *'  # 1:00 PM EDT
    - cron: '0 20 * * *'  # 4:00 PM EDT
    - cron: '0 23 * * *'  # 7:00 PM EDT

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the JSON file back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install required libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scraper Script
        run: python scraper.py

      - name: Save and Push JSON File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sportdata.json
          
          # This command ensures Git only commits if new data was actually added
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated schedule update: $(date)"
          git push
