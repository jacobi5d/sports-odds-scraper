name: Scrape Sports Odds

on:
  workflow_dispatch: # Enables the manual "Run workflow" button
  
  # UTC Cron schedule for 10am, 1pm, 4pm, 7pm EDT (UTC-4)
  schedule:
    - cron: '0 14 * * *'  
    - cron: '0 17 * * *'  
    - cron: '0 20 * * *'  
    - cron: '0 23 * * *'  

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the bot permission to update sportdata.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sportdata.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated data scrape: $(date)"
          git push
