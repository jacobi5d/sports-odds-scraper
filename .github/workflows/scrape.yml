name: Scrape Sports Odds

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
  # Runs at 10:00, 13:00, 16:00, and 19:00 EDT
  # Note: GitHub Actions runs on UTC. 
  # EDT is UTC-4. So 10am EDT = 14:00 UTC.
  # (Be aware this will shift by 1 hour during Standard Time in the Winter).
  schedule:
    - cron: '0 14 * * *'  # 10 AM EDT
    - cron: '0 17 * * *'  # 1 PM EDT
    - cron: '0 20 * * *'  # 4 PM EDT
    - cron: '0 23 * * *'  # 7 PM EDT

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the JSON file back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytz

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sportdata.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated data scrape: $(date)"
          git push
